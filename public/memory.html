<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Juego de memoria interactivo.">
    <title>Juego de Memoria 🧠</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        html, body {
            background-color: #111827 !important;
            margin: 0;
            padding: 0;
        }
        #global-page-loader {
            position: fixed;
            inset: 0;
            z-index: 99999999;
            background: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            opacity: 1;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #global-page-loader.loaded {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .global-loader-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(250, 204, 21, 0.15);
            border: 4px solid rgba(250, 204, 21, 0.3);
            border-top-color: #FACC15;
            animation: spinGlobalLoader 0.85s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.25);
        }
        @keyframes spinGlobalLoader {
            to { transform: rotate(360deg); }
        }
        .global-loader-text {
            color: #F3F4F6;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: 0.5px;
        }
    </style>
    <script src="custom-alerts.js?v=1.0"></script>
    <link rel="stylesheet" href="style.css?v=1.2">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>

    <style>
        /* ⭐️ SOLUCIÓN FOUC: Ocultar el contenedor principal hasta que la configuración esté cargada. */
        .quiz-container {
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
    </style>
    
    <style>
        /* ⭐️ VALORES DE RESPALDO PARA EL JUEGO DE MEMORIA ⭐️ */
        :root {
            --mem-card-height: 110px;
            --mem-card-border-radius: 10px;
            --mem-card-back-bg: var(--honey-gold, #F59E0B);
            --mem-card-back-border-color: var(--bee-black, #1F2937);
        }

        /* ⭐️ NUEVO: Estilos para el contenedor de Memoria */
        .quiz-container.memory-mode {
            background-color: var(--memory-container-bg, rgba(255, 255, 255, 0.9));
            border-radius: var(--memory-container-border-radius, 15px);
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            min-height: calc(100vh - 40px); /* Previene colapso de altura */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

    
        /* Estilos específicos para la cuadrícula del juego de memoria */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 columnas por defecto */
            gap: 5px;
            padding: 10px;
            /* 💡 Aumentado el ancho máximo para dar más espacio a las cartas */
            max-width: 600px; 
            margin: 20px auto;
        }

        /* 💡 SOLUCIÓN RÁPIDA: Ocultar los elementos de la cuadrícula por defecto */
        #memory-game-grid {
            display: none; 
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* ⭐️ ESTILOS DE CARTA AHORA CON VARIABLES ⭐️ */
        .card {
            background-color: transparent; /* El fondo lo da el inner */
            border: none; /* El borde lo da el back */
            height: var(--mem-card-height); 
            border-radius: var(--mem-card-border-radius);
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease-in-out;
            touch-action: manipulation;
        }
        
        /* 🚨 SOLUCIÓN AL PROBLEMA DE INTERACCIÓN 🚨 */
        .modal-full-screen.hidden {
            display: none !important;
            /* Asegura que no captura clics */
            pointer-events: none !important; 
        }

        /* 🚨 ESTILOS DEL CONTENEDOR MODAL/FLOTANTE (Para móviles) */
        .modal-full-screen {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95); 
            z-index: 9999; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto; 
        }

        /* Contenedor interno para que se vea como una sección */
        .quiz-section-floating {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px; 
            margin-top: 20px;
        }

        /* Ajuste específico para el grid dentro del modal */
        .modal-full-screen .grid-container {
            max-width: none; 
            margin: 10px auto;
        }
        .close-btn:hover {
            color: #F44336 !important;
        }

        /* RE-AJUSTE DE TAMAÑOS DE CARTA PARA MÓVILES */
        @media (max-width: 768px) {
            .modal-full-screen .card {
                height: 140px; 
            }
            .modal-full-screen .grid-container {
                max-width: 95%;
                padding: 5px;
            }
        }
        @media (max-width: 400px) {
            .modal-full-screen .card {
                height: 100px; 
            }
        }
        /* ... el resto de las reglas CSS de la tarjeta (mantenidas) ... */
    
        .card-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s; 
            transform-style: preserve-3d;
        }
        /* ... el resto de estilos de la tarjeta ... */
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front {
            background-color: var(--bee-yellow);
            color: var(--bee-black);
            transform: rotateY(180deg);
            padding: 2px; 
            /* ⭐️ Aseguramos que el radius de la carta se aplique aquí */
            border-radius: var(--mem-card-border-radius);
            overflow: hidden; /* Para que la imagen no se salga */
        }

        .card-front img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            border-radius: 5px; /* Un radius más pequeño para la imagen interna */
        }

        /* ⭐️ ESTILO DEL REVERSO DE LA CARTA AHORA CON VARIABLES ⭐️ */
        .card-back {
            background-color: var(--mem-card-back-bg);
            border: 3px solid var(--mem-card-back-border-color);
            color: white;
            font-size: 1.5em;
            /* ⭐️ Aseguramos que el radius de la carta se aplique aquí */
            border-radius: var(--mem-card-border-radius);
            overflow: hidden;
        }

        /* Estilo para los resultados */
        .results-container h2 {
            color: var(--honey-gold);
            margin-bottom: 10px;
            font-size: 1.8em;
            font-weight: 900;
        }
        
    </style>
</head>
<body>

    <div id="global-page-loader">
        <div class="global-loader-circle">🐝</div>
        <div class="global-loader-text">Cargando experiencia...</div>
    </div>
    
    <div class="quiz-container memory-mode">
        
        <div id="start-screen" class="quiz-section">
            <h1 id="memory-title-text" class="title">Juego de Memoria <span class="icon-memory">🧠</span></h1>
            <p class="mb-4">Ingresa tu nombre para comenzar a encontrar las parejas:</p>
            
            <div id="player-name-badge" class="name-badge hidden">
                🐝 Juegas como: <span id="player-name-badge-text"></span>
            </div>
            <div id="player-name-input-container">
                <label for="player-name-input" style="display: block; font-weight: bold; margin-bottom: 5px;">Tu Nombre de Jugador:</label>
                <input type="text" id="player-name-input" class="text-input" placeholder="Tu Nombre" maxlength="20">            
            </div>
            <!-- ⭐️ CORRECCIÓN: Se usan las clases de botón consistentes con los otros juegos -->
            <button id="start-btn" class="btn-portal btn-trivia mt-4">¡Comenzar!</button>

            <div style="text-align: center; margin-top: 20px;">
                <button onclick="window.navigateToPage('index.html')" style="background: none; border: none; color: #666; font-size: 0.9em; cursor: pointer;">
                    Volver al Portal
                </button>
            </div>
        </div>
        <div id="modal-memory-game" class="modal-full-screen hidden">
            
            <div id="game-mode-container" class="quiz-section-floating"> 
                <div id="game-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px; background: #fff8e1; border-radius: 10px;">
                    <div id="player-name-display" style="font-weight: bold;">Jugador: -</div> 
                    <div id="timer" class="timer">Tiempo: <span>0</span>s</div>
                    <button id="close-modal-btn" class="close-btn" style="background: none; border: none; font-size: 1.5em; cursor: pointer; color: var(--bee-black); padding: 5px;">✖️</button>
                </div>
                
                <div id="memory-game-grid" class="grid-container">
                    <p class="text-center text-gray-500">Cargando imágenes...</p>
                </div>
            </div>

            <div id="results" class="results-container hidden">
                <h2><span class="icon-win">🎉</span> ¡Memoria Completada! <span class="icon-win">🎉</span></h2>
                <p id="final-time">Tu tiempo fue de: 0 segundos</p>
                
                <button onclick="window.navigateToPage('index.html')" class="save-btn mt-4" style="background: var(--honey-gold);">Volver al Portal</button>
                <button id="play-again-modal-btn" class="save-btn mt-4" style="background: var(--spring-green);">Jugar de Nuevo</button>
            </div>

        </div>
        </div>
    <script type="module" src="script.js?v=1.2"></script>
</body>
</html>
