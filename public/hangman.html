<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Juego del ahorcado interactivo.">
    <title>Juego del Ahorcado <span class="icon-main">🐝</span></title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <style>
        html, body {
            background-color: #111827 !important;
            margin: 0;
            padding: 0;
        }
        #global-page-loader {
            position: fixed;
            inset: 0;
            z-index: 99999999;
            background: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            opacity: 1;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #global-page-loader.loaded {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .global-loader-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(250, 204, 21, 0.15);
            border: 4px solid rgba(250, 204, 21, 0.3);
            border-top-color: #FACC15;
            animation: spinGlobalLoader 0.85s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.25);
        }
        @keyframes spinGlobalLoader {
            to { transform: rotate(360deg); }
        }
        .global-loader-text {
            color: #F3F4F6;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: 0.5px;
        }
    </style>
    <script src="custom-alerts.js?v=1.0"></script>
    <link rel="stylesheet" href="style.css?v=1.2"> 
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
    
    <style>
        /* ⭐️ SOLUCIÓN FOUC: Ocultar el contenedor principal hasta que la configuración esté cargada. */
        .quiz-container {
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
    </style>

    <style>
        :root {
            /* ⭐️ SOLUCIÓN: Se añaden las variables de color para que el dibujo sea visible */
            --bee-yellow: #FACC15;
            --bee-black: #1F2937;
            --honey-gold: #F59E0B;

            --btn-hangman-bg: var(--bee-yellow, #FACC15);
            --btn-hangman-text-color: var(--bee-black, #1F2937);
            --btn-hangman-border-color: var(--honey-gold, #F59E0B);
            --btn-hangman-shadow-color: var(--honey-gold, #F59E0B);
        }

        /* Estilos específicos para el Ahorcado */
        .hangman-container.hangman-mode {
            /* Usar el estilo base de quiz-container */
            background-color: var(--hangman-container-bg, rgba(255, 255, 255, 0.9));
            border-radius: var(--hangman-container-border-radius, 15px);
            padding: 20px; /* Mantener padding interno */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        #hangman-art {
            font-family: monospace;
            white-space: pre;
            font-size: 1.2em;
            line-height: 1;
            color: var(--bee-black);
            margin: 20px auto;
            border: 2px dashed var(--honey-gold);
            padding: 10px;
            background-color: var(--spring-bg);
            border-radius: 8px;
        }

        #word-display {
            font-size: 2.5em;
            letter-spacing: 0.5em; /* Separación grande entre guiones */
            margin: 20px 0;
            font-weight: 900;
            color: var(--honey-gold);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            white-space: pre-wrap;
            word-break: break-all;
        }

        #keyboard-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-top: 20px;
        }

        .key-btn {
            /* Estilo de tecla */
            background-color: var(--btn-hangman-bg);
            color: var(--btn-hangman-text-color);
            font-weight: bold;
            border: 2px solid var(--btn-hangman-border-color);
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            transition: all 0.1s; 
            box-shadow: 0 3px var(--btn-hangman-shadow-color);
            min-width: 35px;
            flex-grow: 1;
        }

        .key-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px var(--honey-gold);
            background-color: #ff9800;
        }

        .key-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px var(--honey-gold);
        }

        .key-btn:disabled {
            background-color: #ccc;
            color: #666;
            border-color: #999;
            box-shadow: 0 1px #999;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }
        
        .hangman-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #fff8e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="global-page-loader">
        <div class="global-loader-circle">🐝</div>
        <div class="global-loader-text">Cargando experiencia...</div>
    </div>

    <div class="quiz-container hangman-container hangman-mode">
        
        <div id="start-screen-hangman">
            <h1 id="hangman-title-text" class="title">El Ahorcado <span class="icon-hangman">💀</span></h1>
            <p id="hangman-subtitle-text" class="mb-4">Ingresa tu nombre para comenzar a adivinar la palabra secreta:</p>
            
            <div id="player-name-badge-hangman" class="name-badge hidden">
                🐝 Juegas como: <span id="player-name-badge-text-hangman"></span>
            </div>
            <div id="player-name-input-container-hangman">
                <label for="player-name-input-hangman" style="display: block; font-weight: bold; margin-bottom: 5px;">Tu Nombre de Jugador:</label>
                <input type="text" id="player-name-input-hangman" class="text-input" placeholder="Tu Nombre" maxlength="20">
            </div>

            <button id="start-btn-hangman" class="btn-portal btn-trivia mt-4">¡Comenzar!</button>

            <div style="text-align: center; margin-top: 20px;">
                <button onclick="window.navigateToPage('index.html')" style="background: none; border: none; color: #666; font-size: 0.9em; cursor: pointer;">
                    Volver al Portal
                </button>
            </div>
        </div>
        
        <div id="game-mode-hangman" class="hidden">
            
            <div class="hangman-header">
                <div id="player-name-display-hangman" style="font-weight: bold;">Jugador: -</div> 
                <div id="lives-display">Vidas restantes: 7</div>
            </div>
            
            <div id="hangman-graphic-container" class="hangman-graphic">
    <div class="gallows-base"></div>
    <div class="gallows-pole"></div>
    <div class="gallows-beam"></div>
    <div class="gallows-rope"></div>

    <!-- ⭐️ CORRECCIÓN: Las partes del cuerpo ahora están DENTRO del contenedor del gráfico -->
    <div id="hg-head" class="hangman-part"></div> 
    <div id="hg-body" class="hangman-part"></div>
    <div id="hg-arm-l" class="hangman-part"></div>
    <div id="hg-arm-r" class="hangman-part"></div>
    <div id="hg-leg-l" class="hangman-part"></div>
    <div id="hg-leg-r" class="hangman-part"></div>
    <div id="hg-face" class="hangman-part"></div>
</div>
            
            <p id="word-display">_ _ _ _ _</p>
            
            <p id="game-status" style="font-weight: bold; margin: 15px 0;">Adivina la palabra. Tienes 7 intentos.</p>
            
            <p id="guessed-letters" style="color: #666; font-size: 0.9em;">Letras usadas: </p>
            
            <div id="keyboard-container">
                </div>
            
            <button id="play-again-hangman-btn" class="btn-portal btn-messages mt-6 hidden">
                Jugar de Nuevo
            </button>
            
            <button onclick="window.navigateToPage('index.html')" class="btn-portal btn-trivia mt-4" style="background: #ccc; box-shadow: 0 4px #999;">
                Volver al Portal
            </button>
            
        </div>
        
    </div>
    <script type="module" src="script.js?v=1.2"></script>
</body>
</html>
