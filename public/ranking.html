<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tabla de clasificación del evento.">
    <title>Ranking <span class="icon-ranking">🏆</span></title>
    <script src="https://cdn.tailwindcss.com" defer></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        html, body {
            background-color: #111827 !important;
            margin: 0;
            padding: 0;
        }
        #global-page-loader {
            position: fixed;
            inset: 0;
            z-index: 99999999;
            background: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            opacity: 1;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #global-page-loader.loaded {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .global-loader-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(250, 204, 21, 0.15);
            border: 4px solid rgba(250, 204, 21, 0.3);
            border-top-color: #FACC15;
            animation: spinGlobalLoader 0.85s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.25);
        }
        @keyframes spinGlobalLoader {
            to { transform: rotate(360deg); }
        }
        .global-loader-text {
            color: #F3F4F6;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: 0.5px;
        }
    </style>
    <script src="custom-alerts.js?v=1.0"></script>
    <link rel="stylesheet" href="style.css?v=1.2">
    
    <style>
        /* ⭐️ VALORES DE RESPALDO PARA RANKING ⭐️ */
        :root {
            --ranking-trivia-winner-bg: #FFCC00;
            --ranking-trivia-winner-text: #1F2937;
            --ranking-trivia-winner-border: #F59E0B;
            --ranking-memory-winner-bg: #FFCC00;
            --ranking-memory-winner-text: #1F2937;
            --ranking-memory-winner-border: #F59E0B;
            --ranking-container-bg: rgba(255, 255, 255, 0.95);
            --ranking-container-border-radius: 25px;
        }

        /* Estilos específicos para esta página de ranking */
        body {
            display: block; 
            padding: 1rem;
            min-height: 100vh;
        }

        /* ⭐️ SOLUCIÓN: Ajustar la regla H1 para que herede los estilos globales de style.css */
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            /* Se eliminan otros estilos para que no anulen los globales */
        }

        /* Usamos una clase nueva para no entrar en conflicto con .portal-container */
        .ranking-box.ranking-mode {
            background-color: var(--ranking-container-bg);
            padding: 20px;
            border-radius: var(--ranking-container-border-radius);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 650px; /* Le damos un ancho máximo */
            margin: 20px auto;
            text-align: left;
        }

        /* Estilos copiados de host.html para que las listas se vean igual */
        .question-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background-color: #f9fafb; /* gray-50 */
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb; /* gray-200 */
        }

        /* ⭐️🏆 ESTILOS DE GANADOR REFACTORIZADOS 🏆⭐️ */
        .top-winner-trivia {
            background-color: var(--ranking-trivia-winner-bg) !important;
            color: var(--ranking-trivia-winner-text) !important;
            font-weight: 900 !important;
            border: 3px solid var(--ranking-trivia-winner-border) !important;
            box-shadow: 0 0 15px var(--ranking-trivia-winner-bg);
        }
        
        .top-winner-memory {
            background-color: var(--ranking-memory-winner-bg) !important;
            color: var(--ranking-memory-winner-text) !important;
            font-weight: 900 !important;
            border: 3px solid var(--ranking-memory-winner-border) !important;
            box-shadow: 0 0 15px var(--ranking-memory-winner-bg);
        }
    </style>
</head>
<body>

    <div id="global-page-loader">
        <div class="global-loader-circle">🐝</div>
        <div class="global-loader-text">Cargando experiencia...</div>
    </div>

    <!-- ⭐️ SOLUCIÓN: Envolver todo en un contenedor principal para consistencia -->
    <div class="quiz-container ranking-mode">
        <h1 id="ranking-title-text"><span class="icon-ranking">🏆</span> Rankings <span class="icon-main">🐝</span></h1>

        <div class="ranking-box ranking-mode">
            <h2 class="text-2xl font-black mb-4 text-gray-800 flex items-center justify-center space-x-2">
                <span class="text-yellow-500 text-3xl icon-trivia">✍️</span>
                <span>Ranking de la Trivia</span>
            </h2>
            <p class="text-xs text-gray-600 mb-3 text-center">Clasificado por: Puntuación y luego menor tiempo.</p>
            
            <ul id="ranking-list" class="space-y-2">
                <li class="p-2 text-gray-500 italic text-center">Cargando resultados...</li>
            </ul>
        </div>

        <div class="ranking-box ranking-mode">
            <h2 class="text-2xl font-black mb-4 text-gray-800 flex items-center justify-center space-x-2">
                <span class="text-blue-500 text-3xl icon-memory">🧠</span>
                <span>Ranking de Memoria</span>
            </h2>
            <p class="text-xs text-gray-600 mb-3 text-center">Clasificado por: Menor tiempo.</p>
            
            <ul id="memory-ranking-list" class="space-y-2">
                <li class="p-2 text-gray-500 italic text-center">Cargando resultados...</li>
            </ul>
        <div class="text-center mt-6 mb-4">
            <button type="button" onclick="window.navigateToPage('index.html')" class="btn-portal btn-messages flex items-center justify-center gap-2 mx-auto px-6 py-3 rounded-full font-bold shadow-md hover:scale-105 transition-transform cursor-pointer">
                <span class="icon-portal">🏠</span> Volver al Portal
            </button>
        </div>

        <!-- ⭐️ INICIO DE LA SOLUCIÓN ⭐️ -->
        <!-- 1. Se importa el script principal que contiene la lógica de Firebase. -->
        <script type="module" src="script.js?v=1.2"></script>

        <!-- 2. Se añade un pequeño script para ejecutar la lógica específica de la página de ranking. -->
        <script type="module">
            // Importa la función para inicializar la página desde el script principal.
            import { initializePage } from './script.js';

            // Llama a la función de inicialización, pasándole 'ranking' como el modo actual.
            // Esto le dirá a script.js que cargue el tema y los datos del ranking.
            initializePage('ranking');
        </script>
        <!-- ⭐️ FIN DE LA SOLUCIÓN ⭐️ -->
    </div>
</body>
</html>
